# cargo-deny configuration for rexpipe
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Or in CI: cargo deny --all-features check

[graph]
# Target platforms we officially support
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Check all features to ensure optional dependencies are also validated
all-features = true

# =============================================================================
# Advisories - Security vulnerability and unmaintained crate checks
# =============================================================================
[advisories]
# The database of advisories to check against
db-path = "~/.cargo/advisory-db"
# URL to the advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# How to handle unmaintained crates:
# - "all": error on any unmaintained crate
# - "workspace": only error if it's a direct dependency
# - "transitive": only error if it's a transitive dependency
# - "none": ignore unmaintained advisories
unmaintained = "workspace"
# Ignore specific advisories (add IDs here if you need to temporarily bypass)
ignore = []

# =============================================================================
# Licenses - Ensure all dependencies use acceptable licenses
# =============================================================================
[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
# List of explicitly allowed licenses (all others are denied by default)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # Used by webpki-roots (Mozilla root certificates)
    "CDLA-Permissive-2.0",
]

# Private crates (not published) can skip license checks
[licenses.private]
ignore = true

# Clarify license for specific crates that cargo-deny has trouble detecting
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "unicode-ident"
expression = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"
license-files = [{ path = "LICENSE-UNICODE", hash = 0x3fb01745 }]

# =============================================================================
# Bans - Crate-level restrictions
# =============================================================================
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for wildcard dependencies
wildcards = "deny"
# Allow 1 wildcard for workspace dependencies if needed
allow-wildcard-paths = false
# The graph highlighting used when creating dotgraphs for crates
highlight = "all"

# Crates we explicitly deny and suggest alternatives
deny = [
    # Prefer rustls over openssl for TLS
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    # Prefer native-tls or rustls
    { crate = "libssh2-sys", reason = "Prefer pure Rust alternatives" },
]

# Crates that are allowed to have multiple versions
# (temporary, should be reduced over time)
skip = []

# =============================================================================
# Sources - Restrict where crates can come from
# =============================================================================
[sources]
# Lint level for crates not from an allowed source
unknown-registry = "deny"
# Lint level for crates not from an allowed git source
unknown-git = "warn"
# Only allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific git repositories if needed
allow-git = []
