# Error Log Extraction Pipeline
# Demonstrates pattern library usage for log filtering
#
# Usage:
#   rexpipe -c examples/log-errors.toml < application.log
#
# Extracts only error-level messages and stack traces from logs.

name = "Error Log Extraction"
description = "Extract errors and stack traces from application logs"
version = "1.0.0"

# Use patterns from the logs library (which includes common.toml)
patterns_include = ["patterns/logs.toml"]

# Keep only lines with error-level indicators
[[step]]
type = "filter"
description = "Keep error-level log lines"
pattern = '${level.error}'
action = "keep_line"

# Note: This pipeline uses a simple single-step filter.
# For more complex filtering (e.g., including stack traces
# that follow errors), you may need multiple passes or
# context flags (-A, -B, -C).
#
# Example with context:
#   rexpipe -c examples/log-errors.toml -A 10 < app.log
#
# This shows 10 lines after each error, capturing stack traces.
