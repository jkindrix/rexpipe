name = "secrets-redact-v2"
description = "Redact secrets using pattern library (cleaner version)"
# Usage: cat config.log | rexpipe -c secrets-redact-v2.toml

# Import common patterns - no need to write regex from scratch!
patterns_include = ["../patterns/common.toml"]

# =============================================================================
# PHASE 1: API Keys and Tokens (using library patterns)
# =============================================================================

# AWS Access Keys - use library pattern
[[step]]
type = "substitute"
pattern = "${security.aws_access_key}"
replacement = "[AWS_ACCESS_KEY]"
flags = ["global"]

# Generic API keys - use library pattern
[[step]]
type = "substitute"
pattern = "${security.api_key_generic}"
replacement = "[REDACTED_API_KEY]"
flags = ["global"]

# Password fields - use library pattern
[[step]]
type = "substitute"
pattern = "${security.password_field}"
replacement = "password=[REDACTED]"
flags = ["global"]

# =============================================================================
# PHASE 2: PII (using library patterns)
# =============================================================================

# Email addresses - use library pattern instead of writing regex
[[step]]
type = "substitute"
pattern = "${email}"
replacement = "[EMAIL]"
flags = ["global"]

# US Phone numbers - use library pattern
[[step]]
type = "substitute"
pattern = "${phone_us}"
replacement = "[PHONE]"
flags = ["global"]

# SSN - use library pattern
[[step]]
type = "substitute"
pattern = "${security.ssn}"
replacement = "[SSN]"
flags = ["global"]

# Credit cards - use library pattern
[[step]]
type = "substitute"
pattern = "${security.credit_card}"
replacement = "[CREDIT_CARD]"
flags = ["global"]

# IP addresses - use library pattern
[[step]]
type = "substitute"
pattern = "${net.ipv4_simple}"
replacement = "[IP_ADDR]"
flags = ["global"]

# =============================================================================
# PHASE 3: Paths (custom patterns for these)
# =============================================================================

# Home directories (Unix)
[[step]]
type = "substitute"
pattern = "/home/[a-zA-Z0-9_-]+"
replacement = "~"
flags = ["global"]

# Home directories (macOS)
[[step]]
type = "substitute"
pattern = "/Users/[a-zA-Z0-9_-]+"
replacement = "~"
flags = ["global"]
