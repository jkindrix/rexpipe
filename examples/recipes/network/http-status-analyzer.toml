# HTTP Status Analyzer - Categorizes HTTP status codes
# Usage: rexpipe -c http-status-analyzer.toml < access.log

name = "HTTP Status Analyzer"
description = "Categorizes and highlights HTTP status codes"

[[step]]
type = "substitute"
pattern = '\s(2\d{2})\s'
replacement = ' [OK:$1] '
description = "Mark successful responses"

[[step]]
type = "substitute"
pattern = '\s(3\d{2})\s'
replacement = ' [REDIRECT:$1] '
description = "Mark redirects"

[[step]]
type = "substitute"
pattern = '\s(4\d{2})\s'
replacement = ' [CLIENT_ERROR:$1] '
description = "Mark client errors"

[[step]]
type = "substitute"
pattern = '\s(5\d{2})\s'
replacement = ' [SERVER_ERROR:$1] '
description = "Mark server errors"

[[tests]]
name = "classify_200"
input = "GET /api 200 OK"
expected_output = "GET /api [OK:200] OK"
