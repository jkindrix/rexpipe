# Terraform Output Processor
name = "Terraform Output Processor"
description = "Processes Terraform plan/apply output"

[[step]]
type = "filter"
pattern = '^\s*[+~-]'
action = "keep_line"
description = "Keep change lines"

[[step]]
type = "substitute"
pattern = '^\s*\+\s*'
replacement = '[ADD] '
description = "Mark additions"

[[step]]
type = "substitute"
pattern = '^\s*-\s*'
replacement = '[DEL] '
description = "Mark deletions"

[[step]]
type = "substitute"
pattern = '^\s*~\s*'
replacement = '[MOD] '
description = "Mark modifications"
