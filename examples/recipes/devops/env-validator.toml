# Environment Validator - Validates .env file format
# Usage: rexpipe -c env-validator.toml < .env

name = "Environment File Validator"
description = "Validates .env file format and finds issues"

[[step]]
type = "filter"
pattern = '^[^#=\s]+=[^=]*$'
action = "keep_line"
description = "Keep valid KEY=value lines"

[[step]]
type = "substitute"
pattern = '^([^=]+)=\s*$'
replacement = '[EMPTY] $1='
description = "Mark empty values"

[[step]]
type = "substitute"
pattern = '^(\s+\S)'
replacement = '[LEADING_SPACE] $1'
description = "Mark lines with leading spaces"

[[step]]
type = "substitute"
pattern = '(=.*)(\s+)$'
replacement = '$1[TRAILING_SPACE]'
description = "Mark trailing spaces"

[[tests]]
name = "detect_empty"
input = "API_KEY="
expected_output = "[EMPTY] API_KEY="
