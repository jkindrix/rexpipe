# Dockerfile Linter - Checks for common Dockerfile issues
# Usage: rexpipe -c dockerfile-linter.toml < Dockerfile

name = "Dockerfile Linter"
description = "Finds common issues in Dockerfiles"

[[step]]
type = "filter"
pattern = '^FROM\s+\S+$'
action = "keep_line"
description = "Find FROM without version tag"

[[step]]
type = "filter"
pattern = 'apt-get\s+install(?!.*--no-install-recommends)'
action = "keep_line"
description = "Find apt-get without --no-install-recommends"

[[step]]
type = "filter"
pattern = 'ADD\s+https?://'
action = "keep_line"
description = "Find ADD with URL (use COPY + curl instead)"

[[step]]
type = "filter"
pattern = 'EXPOSE\s+22'
action = "keep_line"
description = "Find SSH port exposure"

[[step]]
type = "substitute"
pattern = '^(.*)$'
replacement = '[LINT] $1'
description = "Mark issues"

[[tests]]
name = "detect_no_tag"
input = "FROM ubuntu"
expected_output = "[LINT] FROM ubuntu"
