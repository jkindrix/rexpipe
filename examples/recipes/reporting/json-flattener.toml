# JSON Key Extractor - Extracts specific keys from JSON
# Usage: rexpipe -c json-flattener.toml < data.json

name = "JSON Key Extractor"
description = "Extracts values for specific JSON keys"

[[step]]
type = "substitute"
pattern = '"(id|name|email|status)"\s*:\s*"?([^",}]+)"?'
replacement = '$1: $2'
description = "Extract common fields"

[[step]]
type = "filter"
pattern = '^(id|name|email|status):'
action = "keep_line"
description = "Keep only extracted fields"

[[tests]]
name = "extract_name"
input = '{"id": 1, "name": "John", "extra": "data"}'
min_matches = 1
