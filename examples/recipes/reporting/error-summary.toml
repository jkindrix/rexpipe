# Error Summary Generator
name = "Error Summary"

[[step]]
type = "filter"
pattern = '(error|exception|failed|failure)'
action = "keep_line"
case_insensitive = true

[[step]]
type = "substitute"
pattern = '^.*?(error|exception|failed|failure)(.{0,80}).*$'
replacement = '$1$2...'
case_insensitive = true
