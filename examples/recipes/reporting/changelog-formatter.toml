# Changelog Formatter
name = "Changelog Formatter"
description = "Formats changelog entries"

[[step]]
type = "substitute"
pattern = '^\*\s+'
replacement = "- "
description = "Normalize bullet points"

[[step]]
type = "substitute"
pattern = '^(fix|feat|docs|style|refactor|test|chore)(\(.+\))?:\s*'
replacement = '[$1] '
case_insensitive = true
description = "Format conventional commits"
