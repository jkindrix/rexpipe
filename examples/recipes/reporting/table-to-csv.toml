# Table to CSV Converter
name = "Table to CSV"
description = "Converts pipe-separated tables to CSV"

[[step]]
type = "substitute"
pattern = '\s*\|\s*'
replacement = ","
description = "Convert pipes to commas"

[[step]]
type = "substitute"
pattern = '^,|,$'
replacement = ""
description = "Remove leading/trailing commas"

[[step]]
type = "filter"
pattern = '^[-+|]+$'
action = "drop_line"
description = "Remove separator lines"
