# CSV Cleaner - Cleans and normalizes CSV data
# Usage: rexpipe -c csv-cleaner.toml < dirty.csv

name = "CSV Cleaner"
description = "Cleans and normalizes CSV data"

[[step]]
type = "substitute"
pattern = '"\s*,\s*"'
replacement = '","'
description = "Remove spaces around delimiters"

[[step]]
type = "substitute"
pattern = '\s{2,}'
replacement = " "
description = "Collapse multiple spaces"

[[step]]
type = "substitute"
pattern = '^\s+|\s+$'
replacement = ""
description = "Trim leading/trailing whitespace"

[[step]]
type = "substitute"
pattern = ',\s*,+'
replacement = ","
description = "Remove empty columns"

[[step]]
type = "filter"
pattern = '^,*$'
action = "drop_line"
description = "Drop empty lines"

[[tests]]
name = "clean_spaces"
input = '"John" , "Doe" , "30"'
expected_output = '"John","Doe","30"'
