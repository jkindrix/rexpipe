# SQL Injection Finder - Detects potential SQL injection vulnerabilities
# Usage: rexpipe -c sql-injection-finder.toml -R src/

name = "SQL Injection Finder"
description = "Finds potential SQL injection vulnerabilities in code"

[[step]]
type = "filter"
pattern = '(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER)\s+.*\+\s*["\']?\$?\w+'
action = "keep_line"
case_insensitive = true
description = "Find string concatenation in SQL"

[[step]]
type = "filter"
pattern = 'execute\s*\(\s*["\'].*\+|query\s*\(\s*["\'].*\+'
action = "keep_line"
case_insensitive = true
description = "Find dynamic query execution"

[[step]]
type = "filter"
pattern = 'f["\']\s*SELECT.*\{|\$["\']SELECT'
action = "keep_line"
description = "Find f-string SQL (Python)"

[[step]]
type = "substitute"
pattern = '^(.*)$'
replacement = '[SQLI RISK] $1'
description = "Mark potential vulnerabilities"

[[tests]]
name = "detect_sqli"
input = 'query = "SELECT * FROM users WHERE id = " + user_id'
expected_output = '[SQLI RISK] query = "SELECT * FROM users WHERE id = " + user_id'
