# Secrets Detector - Finds potential secrets in code
# Usage: rexpipe -c secrets-detector.toml -R src/

name = "Secrets Detector"
description = "Detects potential hardcoded secrets, API keys, and credentials"

[[step]]
type = "filter"
pattern = '(api[_-]?key|secret|password|credential|token|auth|private[_-]?key)\s*[:=]'
action = "keep_line"
case_insensitive = true
description = "Find potential secret assignments"

[[step]]
type = "filter"
pattern = '[A-Za-z0-9+/]{40,}={0,2}'
action = "keep_line"
description = "Find base64-encoded secrets"

[[step]]
type = "filter"
pattern = '(sk-|pk-|rk-)[a-zA-Z0-9]{20,}'
action = "keep_line"
description = "Find API key patterns"

[[step]]
type = "substitute"
pattern = '^(.*)$'
replacement = '[POTENTIAL SECRET] $1'
description = "Mark findings"

[[tests]]
name = "detect_api_key"
input = 'API_KEY = "sk-abc123def456ghi789"'
expected_output = '[POTENTIAL SECRET] API_KEY = "sk-abc123def456ghi789"'
