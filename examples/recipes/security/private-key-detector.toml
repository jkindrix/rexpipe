# Private Key Detector
name = "Private Key Detector"
description = "Detects private keys in files"

[[step]]
type = "filter"
pattern = '-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
action = "keep_line"
description = "Find private key headers"

[[step]]
type = "filter"
pattern = '-----BEGIN CERTIFICATE-----'
action = "keep_line"
description = "Find certificates"

[[step]]
type = "substitute"
pattern = '^(.*)$'
replacement = '[PRIVATE KEY] $1'
