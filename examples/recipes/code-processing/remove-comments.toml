# Remove Comments - Strips comments from source code
# Usage: rexpipe -c remove-comments.toml < source.py

name = "Comment Remover"
description = "Removes single-line and multi-line comments from code"

[[step]]
type = "substitute"
pattern = '//.*$'
replacement = ""
description = "Remove C-style single-line comments"

[[step]]
type = "substitute"
pattern = '#.*$'
replacement = ""
description = "Remove shell/Python-style comments"

[[step]]
type = "substitute"
pattern = '/\*[\s\S]*?\*/'
replacement = ""
description = "Remove C-style multi-line comments"

[[step]]
type = "filter"
pattern = '^\s*$'
action = "drop_line"
description = "Remove empty lines"

[[tests]]
name = "remove_c_comment"
input = "int x = 5; // initialize x"
expected_output = "int x = 5; "
