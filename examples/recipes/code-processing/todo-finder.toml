# TODO Finder - Extracts TODO and FIXME comments
# Usage: rexpipe -c todo-finder.toml -R src/

name = "TODO Finder"
description = "Finds and lists TODO, FIXME, HACK, and XXX comments"

[[step]]
type = "filter"
pattern = '\b(TODO|FIXME|HACK|XXX|BUG|OPTIMIZE|REFACTOR)\b'
action = "keep_line"
case_insensitive = true
description = "Keep lines with TODO markers"

[[step]]
type = "substitute"
pattern = '.*\b(TODO|FIXME|HACK|XXX|BUG|OPTIMIZE|REFACTOR)\b:?\s*(.*)$'
replacement = '[$1] $2'
description = "Format TODO markers"

[[tests]]
name = "find_todo"
input = "// TODO: implement this later"
expected_output = "[TODO] implement this later"

[[tests]]
name = "find_fixme"
input = "# FIXME: broken on edge case"
expected_output = "[FIXME] broken on edge case"
