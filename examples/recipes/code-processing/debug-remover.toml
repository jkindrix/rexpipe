# Debug Statement Remover - Removes debugging code
# Usage: rexpipe -c debug-remover.toml < source.js

name = "Debug Statement Remover"
description = "Removes console.log, print statements, and debug code"

[[step]]
type = "substitute"
pattern = '\bconsole\.(log|debug|info|warn|error)\s*\([^)]*\)\s*;?'
replacement = ""
description = "Remove console.* statements (JavaScript)"

[[step]]
type = "substitute"
pattern = '\bprint\s*\([^)]*\)\s*'
replacement = ""
description = "Remove print() statements (Python)"

[[step]]
type = "substitute"
pattern = '\bprintf\s*\([^)]*\)\s*;'
replacement = ""
description = "Remove printf() statements (C)"

[[step]]
type = "substitute"
pattern = '\bdebugger\s*;'
replacement = ""
description = "Remove debugger statements"

[[step]]
type = "substitute"
pattern = '^\s*#\s*DEBUG\s*$'
replacement = ""
description = "Remove DEBUG markers"

[[tests]]
name = "remove_console_log"
input = 'console.log("debug"); doWork();'
expected_output = ' doWork();'
