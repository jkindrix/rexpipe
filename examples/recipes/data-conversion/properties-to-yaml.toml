# Properties to YAML Converter
name = "Properties to YAML"
description = "Converts Java properties to YAML"

[[step]]
type = "substitute"
pattern = '^([^=]+)=(.*)$'
replacement = "$1: $2"
description = "Convert property format"

[[step]]
type = "substitute"
pattern = '\.'
replacement = ":\n  "
description = "Convert dots to YAML nesting"
