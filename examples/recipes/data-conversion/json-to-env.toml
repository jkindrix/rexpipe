# JSON to ENV Converter
name = "JSON to ENV"
description = "Converts JSON config to env variables"

[[step]]
type = "substitute"
pattern = '"([^"]+)":\s*"([^"]*)"'
replacement = "$1=$2"
description = "Convert string values"

[[step]]
type = "substitute"
pattern = '"([^"]+)":\s*(\d+)'
replacement = "$1=$2"
description = "Convert numeric values"

[[step]]
type = "filter"
pattern = '^[A-Z_]+=.+'
action = "keep_line"
description = "Keep valid env lines"
