# Simple XML Element Extractor
name = "XML Element Extractor"
description = "Extracts XML element content"

[[step]]
type = "substitute"
pattern = '<([^/>]+)>([^<]*)</\1>'
replacement = '"$1": "$2"'
description = "Convert simple elements"

[[step]]
type = "substitute"
pattern = '<([^/>]+)\s*/>'
replacement = '"$1": null'
description = "Convert self-closing elements"
