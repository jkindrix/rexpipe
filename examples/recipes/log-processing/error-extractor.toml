# Error Extractor - Filters and highlights errors from logs
# Usage: rexpipe -c error-extractor.toml < application.log

name = "Error Extractor"
description = "Extracts and categorizes error messages from log files"

[[step]]
type = "filter"
pattern = '(ERROR|FATAL|CRITICAL|EXCEPTION|FAILURE|PANIC)'
action = "keep_line"
case_insensitive = true
description = "Keep only error lines"

[[step]]
type = "substitute"
pattern = '\[(ERROR|FATAL|CRITICAL)\]'
replacement = '[!!! $1 !!!]'
description = "Highlight severity levels"

[[step]]
type = "substitute"
pattern = 'at\s+(\S+)\s*\(([^)]+):(\d+)\)'
replacement = 'at $1 (file: $2, line: $3)'
description = "Format stack trace locations"

[[tests]]
name = "extract_error"
input = "[ERROR] Database connection failed"
expected_output = "[!!! ERROR !!!] Database connection failed"

[[tests]]
name = "filter_info"
input = "[INFO] Application started"
expected_lines = 0
