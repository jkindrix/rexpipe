# Apache Log Parser - Extracts and formats Apache access log entries
# Usage: rexpipe -c apache-parser.toml < access.log

name = "Apache Log Parser"
description = "Parses and reformats Apache combined log format"

[[step]]
type = "extract"
pattern = '^(\S+)\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"(\S+)\s+(\S+)\s+\S+"\s+(\d+)\s+(\d+|-)'
groups = ["ip", "timestamp", "method", "path", "status", "bytes"]
description = "Extract log fields"

[[step]]
type = "substitute"
pattern = '^(\d+\.\d+\.\d+\.\d+)'
replacement = 'IP:$1'
description = "Label IP address"

[[tests]]
name = "parse_access_log"
input = '192.168.1.1 - - [10/Oct/2023:13:55:36 -0700] "GET /index.html HTTP/1.1" 200 2326'
min_matches = 1
