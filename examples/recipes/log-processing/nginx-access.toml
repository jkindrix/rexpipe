# Nginx Access Log Processor
# Usage: rexpipe -c nginx-access.toml < access.log

name = "Nginx Access Log Processor"
description = "Parses and summarizes Nginx access logs"

[[step]]
type = "extract"
pattern = '^(\S+)\s+-\s+-\s+\[([^\]]+)\]\s+"(\w+)\s+([^"]+)"\s+(\d+)\s+(\d+)'
description = "Extract standard Nginx log fields"

[[step]]
type = "substitute"
pattern = '"(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)"'
replacement = 'METHOD:$1'
description = "Label HTTP methods"

[[tests]]
name = "parse_nginx_log"
input = '10.0.0.1 - - [01/Jan/2024:00:00:00 +0000] "GET /api/health HTTP/1.1" 200 15'
min_matches = 1
