# URL Extractor - Extracts URLs from text
# Usage: rexpipe -c url-extractor.toml < document.txt

name = "URL Extractor"
description = "Extracts all URLs from text content"

[[step]]
type = "filter"
pattern = 'https?://[^\s<>"'']+|www\.[^\s<>"'']+'
action = "keep_line"
description = "Keep lines with URLs"

[[step]]
type = "extract"
pattern = '(https?://[^\s<>"'']+|www\.[^\s<>"'']+)'
description = "Extract URLs"

[[tests]]
name = "extract_https"
input = "Visit https://example.com for more info"
min_matches = 1
