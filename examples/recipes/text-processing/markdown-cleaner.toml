# Markdown Cleaner - Converts markdown to plain text
# Usage: rexpipe -c markdown-cleaner.toml < document.md

name = "Markdown to Plain Text"
description = "Strips markdown formatting to produce plain text"

[[step]]
type = "substitute"
pattern = '^\#{1,6}\s+'
replacement = ""
description = "Remove heading markers"

[[step]]
type = "substitute"
pattern = '\*\*([^*]+)\*\*'
replacement = "$1"
description = "Remove bold markers"

[[step]]
type = "substitute"
pattern = '\*([^*]+)\*'
replacement = "$1"
description = "Remove italic markers"

[[step]]
type = "substitute"
pattern = '\[([^\]]+)\]\([^)]+\)'
replacement = "$1"
description = "Convert links to text"

[[step]]
type = "substitute"
pattern = '`([^`]+)`'
replacement = "$1"
description = "Remove inline code markers"

[[step]]
type = "substitute"
pattern = '^>\s+'
replacement = ""
description = "Remove blockquote markers"

[[step]]
type = "substitute"
pattern = '^[-*+]\s+'
replacement = "- "
description = "Normalize list markers"

[[tests]]
name = "convert_heading"
input = "## This is a heading"
expected_output = "This is a heading"

[[tests]]
name = "convert_link"
input = "[Click here](https://example.com)"
expected_output = "Click here"
