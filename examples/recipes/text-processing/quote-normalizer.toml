# Quote Normalizer
name = "Quote Normalizer"
description = "Normalizes smart quotes to straight quotes"

[[step]]
type = "substitute"
pattern = '[\u2018\u2019\u201A\u201B]'
replacement = "'"
description = "Convert smart single quotes"

[[step]]
type = "substitute"
pattern = '[\u201C\u201D\u201E\u201F]'
replacement = '"'
description = "Convert smart double quotes"

[[step]]
type = "substitute"
pattern = '[\u2013\u2014]'
replacement = "-"
description = "Convert dashes"
