# Unicode Cleaner
name = "Unicode Cleaner"
description = "Cleans problematic unicode characters"

[[step]]
type = "substitute"
pattern = '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]'
replacement = ""
description = "Remove control characters"

[[step]]
type = "substitute"
pattern = '\u200B|\u200C|\u200D|\uFEFF'
replacement = ""
description = "Remove zero-width characters"
