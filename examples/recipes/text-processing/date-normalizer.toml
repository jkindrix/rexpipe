# Date Normalizer - Converts dates to ISO format
# Usage: rexpipe -c date-normalizer.toml < data.txt

name = "Date Normalizer"
description = "Converts various date formats to ISO 8601 (YYYY-MM-DD)"

[[step]]
type = "substitute"
pattern = '(\d{1,2})/(\d{1,2})/(\d{4})'
replacement = "$3-$1-$2"
description = "Convert MM/DD/YYYY to YYYY-MM-DD"

[[step]]
type = "substitute"
pattern = '(\d{1,2})-(\d{1,2})-(\d{4})'
replacement = "$3-$1-$2"
description = "Convert MM-DD-YYYY to YYYY-MM-DD"

[[step]]
type = "substitute"
pattern = '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2}),?\s+(\d{4})'
replacement = "$3-$1-$2"
description = "Convert Month DD, YYYY format"

[[tests]]
name = "normalize_us_date"
input = "12/25/2024"
expected_output = "2024-12-25"
