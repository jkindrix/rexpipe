# HTML Tag Stripper
name = "HTML Stripper"
description = "Removes HTML tags from text"

[[step]]
type = "substitute"
pattern = '<[^>]+>'
replacement = ""
description = "Remove HTML tags"

[[step]]
type = "substitute"
pattern = '&nbsp;'
replacement = " "
description = "Convert non-breaking spaces"

[[step]]
type = "substitute"
pattern = '&amp;'
replacement = "&"
description = "Convert ampersands"

[[step]]
type = "substitute"
pattern = '&lt;'
replacement = "<"
description = "Convert less than"

[[step]]
type = "substitute"
pattern = '&gt;'
replacement = ">"
description = "Convert greater than"
