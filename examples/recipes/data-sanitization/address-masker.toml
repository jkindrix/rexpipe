# Address Masker - Masks physical addresses
name = "Address Masker"
description = "Masks physical street addresses"

[[step]]
type = "substitute"
pattern = '\b\d{1,5}\s+\w+\s+(Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Way|Court|Ct|Place|Pl)\b'
replacement = "[ADDRESS]"
case_insensitive = true

[[step]]
type = "substitute"
pattern = '\b\d{5}(-\d{4})?\b'
replacement = "[ZIP]"
description = "Mask ZIP codes"
