# Password Remover - Sanitizes passwords and secrets from config/logs
# Usage: rexpipe -c password-remover.toml < config.txt

name = "Password Remover"
description = "Removes passwords and secrets from configuration files and logs"

[[step]]
type = "substitute"
pattern = '(password|passwd|pwd|secret|token|api_key|apikey|api-key)\s*[:=]\s*["\']?([^"\'\s]+)["\']?'
replacement = "$1=***REDACTED***"
case_insensitive = true
description = "Redact password/secret values"

[[step]]
type = "substitute"
pattern = '(Authorization|Bearer|Basic)\s*[:=]?\s*["\']?([A-Za-z0-9+/=._-]{20,})["\']?'
replacement = "$1: ***REDACTED***"
case_insensitive = true
description = "Redact authorization headers/tokens"

[[step]]
type = "substitute"
pattern = '(AWS_SECRET|AWS_ACCESS|PRIVATE_KEY|SSH_KEY)\s*[:=]\s*["\']?[^"\'\s]+["\']?'
replacement = "$1=***REDACTED***"
case_insensitive = true
description = "Redact AWS/SSH keys"

[[tests]]
name = "password_redaction"
input = "password=supersecret123"
expected_output = "password=***REDACTED***"

[[tests]]
name = "api_key_redaction"
input = "API_KEY: sk-1234567890abcdef"
expected_output = "api_key=***REDACTED***"
