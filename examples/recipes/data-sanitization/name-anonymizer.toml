# Name Anonymizer - Replaces names with placeholders
name = "Name Anonymizer"
description = "Replaces common name patterns with anonymous placeholders"

[[step]]
type = "substitute"
pattern = '\b(Mr|Mrs|Ms|Dr|Prof)\.?\s+[A-Z][a-z]+\s+[A-Z][a-z]+\b'
replacement = "$1. [NAME]"
description = "Replace titled names"

[[step]]
type = "substitute"
pattern = '\b[A-Z][a-z]+\s+[A-Z][a-z]+\b'
replacement = "[PERSON]"
description = "Replace First Last patterns"
