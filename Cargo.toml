[package]
name = "rexpipe"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Justin Kindrix <jkindrix@gmail.com>"]
description = "Unified regex pipeline processor with pattern libraries and multi-file support"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/jkindrix/rexpipe"
repository = "https://github.com/jkindrix/rexpipe"
documentation = "https://docs.rs/rexpipe"
keywords = ["regex", "pipeline", "text-processing", "streaming", "grep"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "examples/**/*", "benches/**/*", "tests/**/*", "LICENSE-*", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "Cargo.toml"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
diffy = "0.4"
dirs = "5.0"
env_logger = "0.11"
aes = { version = "0.8", optional = true }
fancy-regex = { version = "0.17", optional = true }
fpe = { version = "0.6", optional = true }
glob = "0.3"
ignore = "0.4"
indicatif = "0.17"
log = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termcolor = "1.4"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"], optional = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5"
proptest = "1.9"

[features]
default = []
async = ["tokio"]
pcre = ["fancy-regex"]
fpe = ["dep:fpe", "dep:aes"]

[[bin]]
name = "rexpipe"
path = "src/main.rs"

[[bench]]
name = "processing_benchmark"
harness = false
