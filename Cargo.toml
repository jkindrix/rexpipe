[package]
name = "rexpipe"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Justin Kindrix <jkindrix@gmail.com>"]
description = "AI-native regex pipeline processor optimized for AI agents and automated text processing"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/jkindrix/rexpipe"
repository = "https://github.com/jkindrix/rexpipe"
documentation = "https://docs.rs/rexpipe"
keywords = ["regex", "pipeline", "text-processing", "streaming", "grep"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "examples/**/*", "benches/**/*", "tests/**/*", "LICENSE-*", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "Cargo.toml"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
diffy = "0.4"
dirs = "5.0"
env_logger = "0.11"
aes = { version = "0.8", optional = true }
fancy-regex = { version = "0.17", optional = true }
fpe = { version = "0.6", optional = true }
glob = "0.3"
ignore = "0.4"
indicatif = "0.17"
log = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = { version = "0.1", optional = true }
termcolor = "1.4"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"], optional = true }
toml = "0.8"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }

# Structured data support
csv = "1.3"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5"
proptest = "1.9"

[features]
default = []
async = ["tokio"]
pcre = ["fancy-regex"]
fpe = ["dep:fpe", "dep:aes"]
tree-sitter = [
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-json",
    "dep:tree-sitter-yaml",
]

[[bin]]
name = "rexpipe"
path = "src/main.rs"

[[bench]]
name = "processing_benchmark"
harness = false
