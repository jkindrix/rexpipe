[package]
name = "rexpipe"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Justin Kindrix <jkindrix@gmail.com>"]
description = "A modern regex pipeline processor for automated text processing"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/jkindrix/rexpipe"
repository = "https://github.com/jkindrix/rexpipe"
documentation = "https://docs.rs/rexpipe"
keywords = ["regex", "pipeline", "text-processing", "streaming", "grep"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "examples/**/*", "benches/**/*", "tests/**/*", "LICENSE-*", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "Cargo.toml"]

[dependencies]
# === Always-available (WASM-safe core) ===
anyhow = "1.0"
fancy-regex = "0.17"
log = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
# WASM-compatible time shim: maps to performance.now()/Date.now() on wasm32,
# falls through to std::time on native targets.
web-time = "1"

# === CLI-only dependencies (gated behind the `cli` feature) ===
# These are not WASM-compatible or are only meaningful in a terminal/filesystem
# context. They are enabled by default because `default = ["cli"]`.
chrono = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
clap_complete = { version = "4.5", optional = true }
clap_mangen = { version = "0.2", optional = true }
ctrlc = { version = "3.4", optional = true }
diffy = { version = "0.4", optional = true }
dirs = { version = "6.0", optional = true }
env_logger = { version = "0.11", optional = true }
glob = { version = "0.3", optional = true }
globset = { version = "0.4", optional = true }
ignore = { version = "0.4", optional = true }
indicatif = { version = "0.18", optional = true }
rand = { version = "0.9", optional = true }
rayon = { version = "1.11", optional = true }
termcolor = { version = "1.4", optional = true }

# === Other optional features (existing) ===
aes = { version = "0.8", optional = true }
fpe = { version = "0.6", optional = true }
streaming-iterator = { version = "0.1", optional = true }
tokio = { version = "1.48", features = ["full"], optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
ureq = { version = "3.1", optional = true }
notify = { version = "8.0", optional = true }

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5"
proptest = "1.9"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = ["cli"]

# Core feature: the WASM-safe library entry point.
# Enables only dependencies that work on wasm32-unknown-unknown.
# Use this when consuming rexpipe as a library in WASM contexts.
core = []

# CLI feature: enables the full command-line binary and all its supporting
# dependencies (filesystem traversal, progress bars, terminal color, etc.).
# This is the default for existing `cargo build` / `cargo install` users.
cli = [
    "core",
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_mangen",
    "dep:ctrlc",
    "dep:env_logger",
    "dep:termcolor",
    "dep:indicatif",
    "dep:rayon",
    "dep:ignore",
    "dep:dirs",
    "dep:glob",
    "dep:globset",
    "dep:chrono",
    "dep:rand",
    "dep:diffy",
]

async = ["tokio"]
fpe = ["dep:fpe", "dep:aes"]
tree-sitter = [
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-json",
    "dep:tree-sitter-yaml",
]
remote = ["ureq"]
watch = ["notify"]

[lib]
name = "rexpipe"
path = "src/lib.rs"

[[bin]]
name = "rexpipe"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "processing_benchmark"
harness = false

# Release profile optimizations for smaller, faster binaries
[profile.release]
lto = true              # Enable link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Abort on panic for smaller binaries
strip = true            # Strip symbols from binary
opt-level = 3           # Maximum optimization level

# Dev profile with faster builds
[profile.dev]
opt-level = 0
debug = true

# Test profile with some optimization for faster test runs
[profile.test]
opt-level = 1

# Bench profile inherits from release
[profile.bench]
lto = true
codegen-units = 1
