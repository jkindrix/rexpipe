[package]
name = "rexpipe"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Justin Kindrix <jkindrix@gmail.com>"]
description = "A modern regex pipeline processor for automated text processing"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/jkindrix/rexpipe"
repository = "https://github.com/jkindrix/rexpipe"
documentation = "https://docs.rs/rexpipe"
keywords = ["regex", "pipeline", "text-processing", "streaming", "grep"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "examples/**/*", "benches/**/*", "tests/**/*", "LICENSE-*", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "Cargo.toml"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
ctrlc = "3.4"
diffy = "0.4"
dirs = "6.0"
env_logger = "0.11"
aes = { version = "0.8", optional = true }
fancy-regex = { version = "0.17", optional = true }
fpe = { version = "0.6", optional = true }
glob = "0.3"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
log = "0.4"
rand = "0.9"
rayon = "1.11"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = { version = "0.1", optional = true }
termcolor = "1.4"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"], optional = true }
toml = "0.9"
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
ureq = { version = "3.1", optional = true }
notify = { version = "8.0", optional = true }

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5"
proptest = "1.9"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = []
async = ["tokio"]
pcre = ["fancy-regex"]
fpe = ["dep:fpe", "dep:aes"]
tree-sitter = [
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-json",
    "dep:tree-sitter-yaml",
]
remote = ["ureq"]
watch = ["notify"]

[[bin]]
name = "rexpipe"
path = "src/main.rs"

[[bench]]
name = "processing_benchmark"
harness = false

# Release profile optimizations for smaller, faster binaries
[profile.release]
lto = true              # Enable link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Abort on panic for smaller binaries
strip = true            # Strip symbols from binary
opt-level = 3           # Maximum optimization level

# Dev profile with faster builds
[profile.dev]
opt-level = 0
debug = true

# Test profile with some optimization for faster test runs
[profile.test]
opt-level = 1

# Bench profile inherits from release
[profile.bench]
lto = true
codegen-units = 1
